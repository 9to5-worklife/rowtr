<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 1000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="call" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="ret" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L10,5 L0,9" fill="none" stroke="#64748b" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="1172" height="988" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="30" y="44" font-size="23" font-weight="700" fill="#0f172a">Rowtr — request flow (route mode)</text>
  <text x="30" y="68" font-size="13.5" fill="#64748b">A single POST /v1/messages. The first branch that succeeds wins; a local failure always falls back to Claude, so the client never breaks.</text>

  <!-- ===================== lifelines ===================== -->
  <!-- Claude Code -->
  <g><rect x="44" y="84" width="132" height="40" rx="8" fill="#334155"/><text x="110" y="109" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Claude Code</text></g>
  <line x1="110" y1="124" x2="110" y2="984" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
  <!-- Rowtr Proxy -->
  <g><rect x="244" y="84" width="132" height="40" rx="8" fill="#4f46e5"/><text x="310" y="109" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Rowtr Proxy</text></g>
  <line x1="310" y1="124" x2="310" y2="984" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
  <!-- router.Decide -->
  <g><rect x="434" y="84" width="132" height="40" rx="8" fill="#2563eb"/><text x="500" y="109" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">router.Decide</text></g>
  <line x1="500" y1="124" x2="500" y2="984" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
  <!-- Ollama -->
  <g><rect x="624" y="84" width="132" height="40" rx="8" fill="#059669"/><text x="690" y="109" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Ollama · local</text></g>
  <line x1="690" y1="124" x2="690" y2="984" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
  <!-- Claude frontier -->
  <g><rect x="814" y="84" width="132" height="40" rx="8" fill="#d97706"/><text x="880" y="109" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Claude · frontier</text></g>
  <line x1="880" y1="124" x2="880" y2="984" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>
  <!-- usage.Store -->
  <g><rect x="1009" y="84" width="132" height="40" rx="8" fill="#475569"/><text x="1075" y="109" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">usage.Store</text></g>
  <line x1="1075" y1="124" x2="1075" y2="984" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5"/>

  <!-- proxy activation bar -->
  <rect x="305" y="150" width="10" height="820" rx="2" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1"/>

  <!-- ===================== pre-alt messages ===================== -->
  <!-- msg1 -->
  <rect x="150" y="140" width="200" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="118" y="152" font-size="11.5" fill="#334155">POST /v1/messages  ·  x-rowtr-auth</text>
  <line x1="110" y1="158" x2="303" y2="158" stroke="#334155" stroke-width="1.6" marker-end="url(#call)"/>

  <!-- self note -->
  <path d="M315,174 L344,174 L344,190 L317,190" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#call)"/>
  <rect x="350" y="170" width="360" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="352" y="182" font-size="11.5" fill="#475569">authenticate · parse body · ExtractIntent(human) · hasTools?</text>

  <!-- msg2 Decide -->
  <rect x="496" y="206" width="8" height="30" rx="2" fill="#dbeafe" stroke="#93c5fd"/>
  <rect x="340" y="202" width="150" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="342" y="214" font-size="11.5" fill="#334155">Decide(intent, hasTools)</text>
  <line x1="315" y1="220" x2="493" y2="220" stroke="#334155" stroke-width="1.6" marker-end="url(#call)"/>
  <!-- msg3 return -->
  <rect x="330" y="230" width="176" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="332" y="242" font-size="11.5" fill="#475569">Outcome{ Tier, Offloadable, Kind }</text>
  <line x1="496" y1="248" x2="317" y2="248" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ret)"/>

  <!-- ===================== alt frame ===================== -->
  <rect x="70" y="266" width="1044" height="686" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <path d="M70,266 L128,266 L128,282 L118,292 L70,292 Z" fill="#475569"/>
  <text x="86" y="284" font-size="12" font-weight="700" fill="#fff">alt</text>
  <text x="150" y="284" font-size="11.5" font-style="italic" fill="#475569">routing decision</text>

  <!-- R1 dedup -->
  <text x="80" y="312" font-size="11.5" font-weight="600" fill="#0f766e">[ dedup hit — identical housekeeping ≤ 5 min ]</text>
  <rect x="410" y="326" width="180" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="412" y="338" font-size="11.5" fill="#334155">record(cache · saved $)</text>
  <rect x="1071" y="330" width="8" height="14" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
  <line x1="315" y1="344" x2="1068" y2="344" stroke="#334155" stroke-width="1.6" marker-end="url(#call)"/>
  <rect x="140" y="352" width="252" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="142" y="364" font-size="11.5" fill="#475569">cached reply · X-Rowtr-Tier: cache</text>
  <line x1="303" y1="370" x2="112" y2="370" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ret)"/>

  <line x1="70" y1="384" x2="1114" y2="384" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 5"/>

  <!-- R2 local offload -->
  <text x="80" y="406" font-size="11.5" font-weight="600" fill="#047857">[ offloadable &amp; tool-free ]</text>
  <rect x="686" y="424" width="8" height="66" rx="2" fill="#d1fae5" stroke="#6ee7b7"/>
  <rect x="440" y="418" width="160" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="442" y="430" font-size="11.5" fill="#334155">Chat(system, messages)</text>
  <line x1="315" y1="436" x2="683" y2="436" stroke="#334155" stroke-width="1.6" marker-end="url(#call)"/>
  <rect x="470" y="446" width="130" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="472" y="458" font-size="11.5" fill="#475569">local completion</text>
  <line x1="690" y1="464" x2="317" y2="464" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ret)"/>
  <rect x="1071" y="476" width="8" height="14" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="410" y="474" width="240" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="412" y="486" font-size="11.5" fill="#334155">record(local · tokens · saved $)</text>
  <line x1="315" y1="492" x2="1068" y2="492" stroke="#334155" stroke-width="1.6" marker-end="url(#call)"/>
  <rect x="140" y="500" width="256" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="142" y="512" font-size="11.5" fill="#475569">Anthropic-shaped reply · X-Rowtr-Tier: local</text>
  <line x1="303" y1="518" x2="112" y2="518" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ret)"/>

  <line x1="70" y1="532" x2="1114" y2="532" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 5"/>

  <!-- R3 downshift -->
  <text x="80" y="554" font-size="11.5" font-weight="600" fill="#b45309">[ internal housekeeping · downshift on ]</text>
  <rect x="876" y="572" width="8" height="40" rx="2" fill="#fef3c7" stroke="#fcd34d"/>
  <rect x="470" y="566" width="330" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="472" y="578" font-size="11.5" fill="#334155">forward · model → claude-haiku (downshift)</text>
  <line x1="315" y1="584" x2="873" y2="584" stroke="#334155" stroke-width="1.6" marker-end="url(#call)"/>
  <rect x="480" y="594" width="260" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="482" y="606" font-size="11.5" fill="#475569">reply · tap records real tokens</text>
  <line x1="880" y1="612" x2="317" y2="612" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ret)"/>
  <rect x="150" y="620" width="180" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="152" y="632" font-size="11.5" fill="#475569">reply (cheaper tier)</text>
  <line x1="303" y1="638" x2="112" y2="638" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ret)"/>

  <line x1="70" y1="652" x2="1114" y2="652" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 5"/>

  <!-- R4 cascade -->
  <text x="80" y="674" font-size="11.5" font-weight="600" fill="#047857">[ cascade on · tool-free, frontier-leaning ]</text>
  <rect x="686" y="692" width="8" height="76" rx="2" fill="#d1fae5" stroke="#6ee7b7"/>
  <rect x="460" y="686" width="120" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="462" y="698" font-size="11.5" fill="#334155">complete locally</text>
  <line x1="315" y1="704" x2="683" y2="704" stroke="#334155" stroke-width="1.6" marker-end="url(#call)"/>
  <rect x="490" y="714" width="110" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="492" y="726" font-size="11.5" fill="#475569">draft answer</text>
  <line x1="690" y1="732" x2="317" y2="732" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ret)"/>
  <rect x="450" y="742" width="150" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="452" y="754" font-size="11.5" fill="#334155">judge answer (0–10)</text>
  <line x1="315" y1="760" x2="683" y2="760" stroke="#334155" stroke-width="1.6" marker-end="url(#call)"/>
  <rect x="330" y="772" width="470" height="18" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="342" y="785" font-size="11" fill="#065f46">score ≥ 7 → serve local (X-Rowtr-Cascade-Score)  ·  else escalate ↓ to frontier</text>

  <line x1="70" y1="804" x2="1114" y2="804" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 5"/>

  <!-- R5 frontier -->
  <text x="80" y="826" font-size="11.5" font-weight="600" fill="#b45309">[ else — real reasoning / tool use ]</text>
  <rect x="876" y="844" width="8" height="42" rx="2" fill="#fef3c7" stroke="#fcd34d"/>
  <rect x="440" y="838" width="290" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="442" y="850" font-size="11.5" fill="#334155">forward unchanged — byte-identical</text>
  <line x1="315" y1="856" x2="873" y2="856" stroke="#334155" stroke-width="1.6" marker-end="url(#call)"/>
  <rect x="480" y="866" width="220" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="482" y="878" font-size="11.5" fill="#475569">streamed reply (SSE)</text>
  <line x1="880" y1="884" x2="317" y2="884" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ret)"/>
  <rect x="1071" y="896" width="8" height="14" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="410" y="894" width="270" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="412" y="906" font-size="11.5" fill="#334155">tap records real tokens · cache split</text>
  <line x1="315" y1="912" x2="1068" y2="912" stroke="#334155" stroke-width="1.6" marker-end="url(#call)"/>
  <rect x="150" y="920" width="230" height="16" rx="3" fill="#f8fafc" opacity="0.95"/>
  <text x="152" y="932" font-size="11.5" fill="#475569">streamed reply (SSE passthrough)</text>
  <line x1="303" y1="938" x2="112" y2="938" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ret)"/>

  <!-- legend -->
  <g transform="translate(772,132)">
    <rect x="0" y="0" width="342" height="70" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="16" y="22" font-size="12" font-weight="700" fill="#334155">Legend</text>
    <line x1="16" y1="40" x2="70" y2="40" stroke="#334155" stroke-width="1.6" marker-end="url(#call)"/>
    <text x="80" y="44" font-size="11" fill="#475569">synchronous call</text>
    <line x1="16" y1="58" x2="70" y2="58" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ret)"/>
    <text x="80" y="62" font-size="11" fill="#475569">return</text>
    <rect x="216" y="34" width="10" height="12" rx="2" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="234" y="44" font-size="11" fill="#475569">activation</text>
  </g>
</svg>
