<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tri" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L14,7 L1,13 Z" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
    </marker>
    <marker id="diamond" markerWidth="22" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,6 L11,1 L20,6 L11,11 Z" fill="#ffffff" stroke="#4f46e5" stroke-width="1.3"/>
    </marker>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L10,5 L0,9" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="1024" height="664" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="34" y="46" font-size="23" font-weight="700" fill="#0f172a">Rowtr — static structure</text>
  <text x="34" y="70" font-size="14" fill="#64748b">Two model tiers behind one interface each; the proxy is the hub that aggregates them. Implementations sit on the row below their interface.</text>

  <!-- cmd/rowtr entry -->
  <g>
    <rect x="430" y="88" width="200" height="48" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect x="430" y="88" width="200" height="24" rx="8" fill="#4f46e5"/>
    <rect x="430" y="100" width="200" height="12" fill="#4f46e5"/>
    <text x="530" y="105" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">cmd/rowtr</text>
    <text x="530" y="128" font-size="11" fill="#475569" text-anchor="middle">wires router · backends · proxy · store</text>
  </g>

  <!-- Router interface -->
  <g>
    <rect x="40" y="160" width="234" height="66" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="40" y="160" width="234" height="34" rx="7" fill="#2563eb"/>
    <rect x="40" y="180" width="234" height="14" fill="#2563eb"/>
    <text x="157" y="175" font-size="10.5" font-style="italic" fill="#dbeafe" text-anchor="middle">«interface»</text>
    <text x="157" y="189" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">router.Router</text>
    <text x="54" y="214" font-size="12" fill="#1e293b">+ Route(ctx, prompt) Decision</text>
  </g>

  <!-- proxy.Server hub -->
  <g>
    <rect x="400" y="150" width="250" height="180" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="400" y="150" width="250" height="28" rx="8" fill="#4f46e5"/>
    <rect x="400" y="164" width="250" height="14" fill="#4f46e5"/>
    <text x="525" y="169" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">proxy.Server</text>
    <text x="414" y="196" font-size="11.5" fill="#475569">− router  Router</text>
    <text x="414" y="214" font-size="11.5" fill="#475569">− local  *Ollama</text>
    <text x="414" y="232" font-size="11.5" fill="#475569">− store  *usage.Store</text>
    <text x="414" y="250" font-size="11.5" fill="#475569">− dedup · shadow · tap</text>
    <text x="414" y="268" font-size="11.5" fill="#475569">− mode  Mode</text>
    <line x1="400" y1="282" x2="650" y2="282" stroke="#e2e8f0"/>
    <text x="414" y="302" font-size="11.5" fill="#1e293b">+ handleMessages()</text>
    <text x="414" y="320" font-size="11.5" fill="#1e293b">+ serveLocal()  + forward()</text>
  </g>

  <!-- Backend interface -->
  <g>
    <rect x="772" y="160" width="248" height="100" rx="7" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="772" y="160" width="248" height="34" rx="7" fill="#0d9488"/>
    <rect x="772" y="180" width="248" height="14" fill="#0d9488"/>
    <text x="896" y="175" font-size="10.5" font-style="italic" fill="#ccfbf1" text-anchor="middle">«interface»</text>
    <text x="896" y="189" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">backend.Backend</text>
    <text x="786" y="214" font-size="12" fill="#1e293b">+ Complete(ctx, prompt) Response</text>
    <text x="786" y="232" font-size="12" fill="#1e293b">+ Available(ctx) error</text>
    <text x="786" y="250" font-size="12" fill="#1e293b">+ Tier() Tier   + Name() string</text>
  </g>

  <!-- KeywordRouter -->
  <g>
    <rect x="34" y="370" width="170" height="86" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="34" y="370" width="170" height="26" rx="7" fill="#1d4ed8"/>
    <rect x="34" y="384" width="170" height="12" fill="#1d4ed8"/>
    <text x="119" y="388" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">KeywordRouter</text>
    <text x="46" y="414" font-size="11.5" fill="#475569">− longPromptWords int</text>
    <line x1="34" y1="422" x2="204" y2="422" stroke="#e2e8f0"/>
    <text x="46" y="440" font-size="11.5" fill="#1e293b">+ Route() Decision</text>
    <text x="46" y="452" font-size="10" fill="#94a3b8">free · verb heuristic</text>
  </g>

  <!-- ModelRouter -->
  <g>
    <rect x="214" y="370" width="180" height="104" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="214" y="370" width="180" height="26" rx="7" fill="#1d4ed8"/>
    <rect x="214" y="384" width="180" height="12" fill="#1d4ed8"/>
    <text x="304" y="388" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ModelRouter</text>
    <text x="226" y="414" font-size="11.5" fill="#475569">− host, model string</text>
    <text x="226" y="430" font-size="11.5" fill="#475569">− fallback Router</text>
    <line x1="214" y1="438" x2="394" y2="438" stroke="#e2e8f0"/>
    <text x="226" y="456" font-size="11.5" fill="#1e293b">+ Route() + RouteChecked()</text>
    <text x="226" y="468" font-size="10" fill="#94a3b8">SLM classifier · shadow-only</text>
  </g>

  <!-- realization arrows to Router -->
  <path d="M119,370 L150,226" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#tri)"/>
  <path d="M304,370 L240,226" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#tri)"/>

  <!-- Ollama -->
  <g>
    <rect x="700" y="372" width="152" height="84" rx="7" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="700" y="372" width="152" height="26" rx="7" fill="#059669"/>
    <rect x="700" y="386" width="152" height="12" fill="#059669"/>
    <text x="776" y="390" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Ollama · local</text>
    <text x="712" y="416" font-size="11.5" fill="#475569">− host, model</text>
    <line x1="700" y1="424" x2="852" y2="424" stroke="#e2e8f0"/>
    <text x="712" y="443" font-size="11.5" fill="#1e293b">+ Chat()  + Complete()</text>
  </g>

  <!-- Anthropic -->
  <g>
    <rect x="868" y="372" width="152" height="84" rx="7" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect x="868" y="372" width="152" height="26" rx="7" fill="#d97706"/>
    <rect x="868" y="386" width="152" height="12" fill="#d97706"/>
    <text x="944" y="390" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Anthropic · frontier</text>
    <text x="880" y="416" font-size="11.5" fill="#475569">− model; maxTokens</text>
    <line x1="868" y1="424" x2="1020" y2="424" stroke="#e2e8f0"/>
    <text x="880" y="443" font-size="11.5" fill="#1e293b">+ Complete()</text>
  </g>

  <!-- realization arrows to Backend -->
  <path d="M776,372 L830,260" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#tri)"/>
  <path d="M944,372 L910,260" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#tri)"/>

  <!-- cmd -> Server (dependency) -->
  <path d="M530,136 L525,150" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Server aggregates Router -->
  <path d="M400,208 L274,192" fill="none" stroke="#4f46e5" stroke-width="1.5" marker-start="url(#diamond)"/>
  <!-- Server aggregates Ollama (local) -->
  <path d="M650,286 L700,398" fill="none" stroke="#4f46e5" stroke-width="1.5" marker-start="url(#diamond)"/>
  <!-- Server aggregates usage.Store -->
  <path d="M525,330 L500,395" fill="none" stroke="#4f46e5" stroke-width="1.5" marker-start="url(#diamond)"/>

  <!-- usage.Store -->
  <g>
    <rect x="405" y="395" width="190" height="82" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="405" y="395" width="190" height="26" rx="7" fill="#475569"/>
    <rect x="405" y="409" width="190" height="12" fill="#475569"/>
    <text x="500" y="413" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">usage.Store · SQLite</text>
    <text x="419" y="439" font-size="11.5" fill="#1e293b">+ Record(Event)</text>
    <text x="419" y="457" font-size="11.5" fill="#1e293b">+ Summary() / SummarySince()</text>
    <text x="419" y="470" font-size="10" fill="#94a3b8">tiers · tokens · cache · saved $</text>
  </g>

  <!-- config -->
  <g>
    <rect x="615" y="395" width="205" height="82" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="615" y="395" width="205" height="26" rx="7" fill="#475569"/>
    <rect x="615" y="409" width="205" height="12" fill="#475569"/>
    <text x="717" y="413" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">config</text>
    <text x="629" y="439" font-size="11.5" fill="#1e293b">Load() · defaults→file→env</text>
    <text x="629" y="457" font-size="11.5" fill="#1e293b">price table · EstimateCostUSD()</text>
  </g>
  <path d="M595,436 L615,436" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- cmd/rowtr-tray -->
  <g>
    <rect x="405" y="506" width="190" height="46" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="405" y="506" width="190" height="24" rx="7" fill="#334155"/>
    <rect x="405" y="518" width="190" height="12" fill="#334155"/>
    <text x="500" y="522" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">cmd/rowtr-tray</text>
    <text x="500" y="545" font-size="10" fill="#64748b" text-anchor="middle">macOS menu-bar · reads store</text>
  </g>
  <path d="M500,506 L500,477" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- Decide note -->
  <g>
    <path d="M34,496 L312,496 L334,518 L334,592 L34,592 Z" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
    <path d="M312,496 L312,518 L334,518 Z" fill="#fde68a" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="48" y="520" font-size="12" font-weight="700" fill="#92400e">router.Decide(r, humanText, hasTools)</text>
    <text x="48" y="540" font-size="11.5" fill="#78350f">→ Outcome{ Tier, Reason, Intent,</text>
    <text x="48" y="555" font-size="11.5" fill="#78350f">           Internal, Offloadable, Kind }</text>
    <text x="48" y="578" font-size="10.5" fill="#a16207">The single decision both the proxy and score share.</text>
  </g>
  <path d="M334,512 L400,300" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- legend -->
  <g transform="translate(650,500)">
    <rect x="0" y="0" width="304" height="140" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3"/>
    <text x="16" y="24" font-size="12.5" font-weight="700" fill="#334155">Notation</text>
    <path d="M18,44 L74,44" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#tri)"/>
    <text x="86" y="48" font-size="11.5" fill="#475569">realizes / implements an interface</text>
    <path d="M18,74 L74,74" fill="none" stroke="#4f46e5" stroke-width="1.5" marker-start="url(#diamond)"/>
    <text x="86" y="78" font-size="11.5" fill="#475569">aggregation — proxy.Server has-a</text>
    <path d="M18,104 L74,104" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="86" y="108" font-size="11.5" fill="#475569">dependency — uses / wires</text>
    <rect x="18" y="122" width="14" height="12" rx="2" fill="#059669"/>
    <rect x="38" y="122" width="14" height="12" rx="2" fill="#d97706"/>
    <text x="60" y="132" font-size="11.5" fill="#475569">local (Ollama) vs frontier (Claude)</text>
  </g>
</svg>
