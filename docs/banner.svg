<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#042f2e"/>
    </linearGradient>
    <marker id="a" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="320" rx="20" fill="url(#bg)"/>

  <!-- wordmark -->
  <text x="72" y="150" font-size="78" font-weight="800" letter-spacing="-2" fill="#ffffff">Rowtr</text>
  <rect x="74" y="168" width="150" height="5" rx="2.5" fill="#22d3ee"/>
  <text x="76" y="212" font-size="24" font-weight="600" fill="#e2e8f0">The intelligent router in front of Claude Code.</text>
  <text x="76" y="246" font-size="17" fill="#94a3b8">Answer the easy prompts on your own machine. Keep Claude for the hard ones.</text>
  <text x="76" y="284" font-size="14" fill="#64748b">Local-first · quota-conserving · measurement-first · one cgo-free binary</text>

  <!-- routing motif -->
  <g transform="translate(830,60)" font-size="13">
    <!-- prompt node -->
    <rect x="0" y="86" width="96" height="34" rx="8" fill="#312e81" stroke="#6366f1" stroke-width="1.5"/>
    <text x="48" y="108" fill="#e0e7ff" text-anchor="middle" font-weight="600">prompt</text>

    <!-- router node -->
    <circle cx="176" cy="103" r="26" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="176" y="99" fill="#67e8f9" text-anchor="middle" font-size="11" font-weight="700">Rowtr</text>
    <text x="176" y="113" fill="#94a3b8" text-anchor="middle" font-size="9">router</text>
    <line x1="96" y1="103" x2="147" y2="103" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>

    <!-- local branch -->
    <line x1="202" y1="90" x2="256" y2="52" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="262" y="30" width="150" height="44" rx="9" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="337" y="50" fill="#6ee7b7" text-anchor="middle" font-weight="700">Local · Ollama</text>
    <text x="337" y="65" fill="#a7f3d0" text-anchor="middle" font-size="10">on your hardware</text>

    <!-- frontier branch -->
    <line x1="202" y1="116" x2="256" y2="152" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="262" y="132" width="150" height="44" rx="9" fill="#4a2a07" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="337" y="152" fill="#fcd34d" text-anchor="middle" font-weight="700">Frontier · Claude</text>
    <text x="337" y="167" fill="#fde68a" text-anchor="middle" font-size="10">only when needed</text>
  </g>
</svg>
